# Publishes docs/ as the instructions site, with the client installers packed
# alongside it as downloads.
#
# The installers are built and copied here from client/ rather than committed
# under docs/, so that there is exactly one copy of each installer in this
# repo. A second copy is the one that goes stale.
#
# One-time repository setting: Settings -> Pages -> Source -> "GitHub Actions".
# Without it this workflow runs green and publishes nothing.

name: Publish the instructions site

on:
  push:
    branches: [main]
    # No tag trigger: `git push --follow-tags` sends a release tag together
    # with its commit, so this run already sees it. A separate tag run would
    # cancel this one (see concurrency below) and is not allowed to deploy to
    # the github-pages environment anyway. To relabel after tagging a commit
    # already pushed, use "Run workflow" (workflow_dispatch).
    paths:
      - 'docs/**'
      - 'client/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push while a deploy is in flight should win, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version number is the latest release
          # tag (client/version.sh), and a shallow clone has none.
          fetch-depth: 0

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site/downloads
          cp -r docs/. _site/
          # The version, from the release tag, onto the download page. The
          # page carries a marked placeholder; refuse to publish without it.
          version=$(sh client/version.sh)
          echo "Version: $version"
          grep -q '<!--LTD_VERSION-->' _site/windows.html \
            || { echo "windows.html has lost its <!--LTD_VERSION--> placeholder"; exit 1; }
          sed -i "s|<!--LTD_VERSION-->[^<]*<!--/LTD_VERSION-->|$version|" _site/windows.html
          # Windows: setup-langtechdepot.bat is built here from the launcher
          # header plus setup-langtechdepot.ps1, which it extracts and runs at
          # install time, so the .ps1 is the only copy anyone edits. It ships
          # in a zip with START-HERE.txt: browsers and mail filters wave a zip
          # through where they question a bare .bat. .gitattributes checks
          # everything out CRLF even on Linux, and the build and zip keep the
          # bytes untouched, so they arrive as Windows files.
          mkdir -p _build
          sh client/build-bat.sh _build/setup-langtechdepot.bat
          # CMD misparses a .bat with LF-only line endings; build-bat.sh checks
          # its inputs, and this checks the result before it is packed.
          grep -q $'\r$' _build/setup-langtechdepot.bat \
            || { echo "setup-langtechdepot.bat lost its CRLF line endings"; exit 1; }
          zip -j _site/downloads/langtechdepot-windows.zip \
            _build/setup-langtechdepot.bat \
            client/START-HERE.txt
          # Linux: the installer is fetched by the one command on linux.html.
          cp client/install-langtechdepot.sh _site/downloads/
          # Linux: the optional command-line catalog tool. (Windows has none
          # to download: the installer installs itself as
          # modify-langtechdepot.bat, which does the same job.)
          cp client/langtechdepot-subscribe.sh _site/downloads/

      - name: Check the download links resolve
        run: |
          set -eu
          # A renamed installer silently turns the download buttons into 404s,
          # and nobody notices until a field user reports it. Catch it here.
          fail=0
          for f in downloads/langtechdepot-windows.zip \
                   downloads/install-langtechdepot.sh \
                   index.html windows.html linux.html help.html \
                   assets/site.css assets/site.js; do
            [ -s "_site/$f" ] || { echo "missing or empty: $f"; fail=1; }
          done
          # Every downloads/ link in the pages must point at a file that was
          # actually built, so a page still naming an old installer fails here
          # instead of publishing a dead button.
          for f in $(grep -oh 'href="downloads/[^"]*"' _site/*.html | sed 's/^href="//; s/"$//' | sort -u); do
            [ -s "_site/$f" ] || { echo "a page links to $f, which was not built"; fail=1; }
          done
          # The zip must hold the installer under the name the pages tell
          # people to double-click.
          unzip -l _site/downloads/langtechdepot-windows.zip | grep -q ' setup-langtechdepot.bat$' \
            || { echo "langtechdepot-windows.zip has no setup-langtechdepot.bat"; fail=1; }
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
