# Publishes docs/ as the instructions site, with the client installers packed
# alongside it as downloads.
#
# The installers are copied here from client/ rather than committed under
# docs/, so that there is exactly one copy of each installer in this repo. A
# second copy is the one that goes stale.
#
# One-time repository setting: Settings -> Pages -> Source -> "GitHub Actions".
# Without it this workflow runs green and publishes nothing.

name: Publish the instructions site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'client/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push while a deploy is in flight should win, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site/downloads
          cp -r docs/. _site/
          # Windows: one self-contained file. setup-langtechdepot.bat is built
          # here from the launcher header plus setup-langtechdepot.ps1, which
          # it extracts and runs at install time - so there is nothing to
          # unzip, and the .ps1 is the only copy of the installer anyone edits.
          # .gitattributes checks both halves out CRLF even on Linux, and the
          # build joins them byte for byte, so it arrives as a Windows file.
          sh client/build-bat.sh _site/downloads/setup-langtechdepot.bat
          # Linux: the installer is fetched by the one command on linux.html.
          cp client/install-langtechdepot.sh _site/downloads/
          # Both platforms: the optional command-line catalog tool.
          cp client/langtechdepot-subscribe.sh _site/downloads/
          cp client/langtechdepot-subscribe.ps1 _site/downloads/

      - name: Check the download links resolve
        run: |
          set -eu
          # A renamed installer silently turns the download buttons into 404s,
          # and nobody notices until a field user reports it. Catch it here.
          fail=0
          for f in downloads/setup-langtechdepot.bat \
                   downloads/install-langtechdepot.sh \
                   index.html windows.html linux.html help.html \
                   assets/site.css assets/site.js; do
            [ -s "_site/$f" ] || { echo "missing or empty: $f"; fail=1; }
          done
          # Every downloads/ link in the pages must point at a file that was
          # actually built, so a page still naming an old installer fails here
          # instead of publishing a dead button.
          for f in $(grep -oh 'href="downloads/[^"]*"' _site/*.html | sed 's/^href="//; s/"$//' | sort -u); do
            [ -s "_site/$f" ] || { echo "a page links to $f, which was not built"; fail=1; }
          done
          # CMD misparses a .bat with LF-only line endings; make sure the CRLF
          # rule in .gitattributes actually held.
          grep -q $'\r$' _site/downloads/setup-langtechdepot.bat \
            || { echo "setup-langtechdepot.bat lost its CRLF line endings"; fail=1; }
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
